services:
  - type: web
    name: roadwatch-backend
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port `$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: CORS_ORIGINS
        value: "*"
      - key: DATABASE_URL
        value: "sqlite:////data/roadwatch.db"
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
